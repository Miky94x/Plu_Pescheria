<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Import articoli</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#050b14; color:#e6f3f3; max-width:420px; margin:0 auto; padding:24px 20px; }
  h1 { font-size:20px; }
  input, button { width:100%; font-size:16px; padding:13px 14px; border-radius:12px; border:1.5px solid rgba(140,200,210,.2); background:#122a3e; color:#e6f3f3; margin-bottom:12px; box-sizing:border-box; }
  button { background:#2fe6d0; color:#050b14; font-weight:800; border:none; cursor:pointer; }
  button:disabled { opacity:.5; }
  #log { font-size:13px; color:#7e97aa; white-space:pre-wrap; }
  .hide { display:none; }
</style>
</head>
<body>
<h1>Import articoli su Firestore</h1>

<div id="loginBox">
  <input type="email" id="email" placeholder="Email" autocomplete="username" />
  <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
  <button id="loginBtn">Accedi</button>
</div>

<div id="importBox" class="hide">
  <p>Seleziona il file <b>articoli.json</b> e carica. Gli articoli già presenti su Firestore vengono sostituiti.</p>
  <input type="file" id="file" accept="application/json,.json" />
  <button id="uploadBtn">Carica su Firestore</button>
</div>

<p id="log"></p>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const logEl = document.getElementById("log");
  const log = (m) => (logEl.textContent = m);

  onAuthStateChanged(auth, (u) => {
    document.getElementById("loginBox").classList.toggle("hide", !!u);
    document.getElementById("importBox").classList.toggle("hide", !u);
    if (u) log("Connesso come " + u.email + "\nUID: " + u.uid);
  });

  document.getElementById("loginBtn").onclick = async () => {
    try {
      await signInWithEmailAndPassword(auth, document.getElementById("email").value.trim(), document.getElementById("password").value);
    } catch (e) { log("Login fallito: " + e.code); }
  };

  document.getElementById("uploadBtn").onclick = async () => {
    const f = document.getElementById("file").files[0];
    if (!f) return log("Seleziona prima articoli.json");
    const btn = document.getElementById("uploadBtn");
    btn.disabled = true;
    try {
      const items = JSON.parse(await f.text());
      if (!Array.isArray(items) || !items.length) throw new Error("File non valido");

      log("Rimuovo i vecchi dati…");
      const old = await getDocs(collection(db, "articoli"));
      let b = writeBatch(db);
      old.forEach((d) => b.delete(d.ref));
      await b.commit();

      const SIZE = 100;
      b = writeBatch(db);
      let n = 0;
      for (let i = 0; i < items.length; i += SIZE) {
        const id = "p" + String(n).padStart(3, "0");
        b.set(doc(db, "articoli", id), { ordine: n, items: items.slice(i, i + SIZE) });
        n++;
      }
      await b.commit();
      log("Fatto: " + items.length + " articoli caricati in " + n + " documenti.");
    } catch (e) {
      log("Errore: " + (e.code || e.message));
    } finally { btn.disabled = false; }
  };
</script>
</body>
</html>
